  html[data-theme="dark"] .tier-Lite{color:#cbd5e1;background:#334155}html[data-theme="dark"] .tier-Standard{color:#bfdbfe;background:#1e3a8a}html[data-theme="dark"] .tier-Premium{color:#ddd6fe;background:#4c1d95}html[data-theme="dark"] .tier-Deal{color:#fde68a;background:#78350f}

  .bar{height:10px;background:var(--bg2);border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),#60a5fa);width:0;animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}@keyframes grow{to{width:var(--w)}}

  .cc-cvv-row{display:flex;align-items:center;gap:10px;justify-content:flex-end;padding:0 22px}.cc-cvv{background:#fff;color:#111;padding:5px 12px;border-radius:5px;font-family:monospace;min-width:54px;text-align:center}

</style>

<script>
/* ===================== client constants ===================== */
const CATEGORIES=["All","Mobile","Broadband","Tablet","Bundles"];
const SEGMENTS=["Mobile","Broadband","Tablet","Bundles"];
const CUSTOM_PARTS={device:[{label:"No device",v:0},{label:"Mobile phone (+£8)",v:8},{label:"Tablet (+£10)",v:10},{label:"Router (+£6)",v:6}],minutes:[{label:"100 minutes (+£3)",v:3},{label:"500 minutes (+£5)",v:5},{label:"Unlimited (+£9)",v:9}],data:[{label:"5 GB (+£4)",v:4},{label:"20 GB (+£7)",v:7},{label:"100 GB (+£12)",v:12}]};
const APP_DISCOUNT=0.15, OFFER_CODES={SAVE10:0.10,WELCOME5:0.05};
let ME=null;

/* ===================== helpers ===================== */
function gbp(n){return "£"+Number(n).toFixed(2);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window._tt);window._tt=setTimeout(()=>e.classList.remove("show"),3200);}

/* =====================================================================
   LOCAL BACKEND  (replaces the old PHP api.php + MySQL)
   Everything below runs INSIDE the phone/browser. Data is kept in
   localStorage so the app works completely offline, with no server.
   The api() function keeps the SAME name and the SAME return shapes
   that the rest of the app expects, so no other code had to change.
   ===================================================================== */
const DB_KEY="cd_db_v1";
function nowStr(){const d=new Date();const p=n=>String(n).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());}
function seedDB(){
  const pk=[
    ["mob-lite","Mobile Lite","Mobile","Lite",12.00,["1 mobile phone","100 free minutes","Unlimited SMS","3 GB data"]],
    ["mobile","Mobile Standard","Mobile","Standard",20.00,["1 mobile phone","500 free minutes","Unlimited SMS","10 GB data"]],
    ["mob-pro","Mobile Premium","Mobile","Premium",30.00,["1 flagship phone","Unlimited minutes","Unlimited SMS","50 GB data"]],
    ["bb-lite","Broadband Lite","Broadband","Lite",18.00,["1 Wi-Fi router","Home broadband","40 GB data"]],

function loadDB(){ try{const d=JSON.parse(localStorage.getItem(DB_KEY));return d&&d.users?d:seedDB();}catch(e){return seedDB();} }
function saveDB(db){ localStorage.setItem(DB_KEY,JSON.stringify(db)); }
function pubUser(u){ return u?{id:u.id,name:u.name,email:u.email,role:u.role,address:u.address,phone:u.phone,card:u.card}:null; }

/* api(action, data) - drop-in replacement for the old server call.
   "action" may carry query params, e.g. "packages&all=1" or "feedback&user_id=3". */
async function api(action,data){
  const parts=String(action).split("&");
  const name=parts[0]; const q={};
  for(let i=1;i<parts.length;i++){const kv=parts[i].split("=");q[kv[0]]=decodeURIComponent(kv[1]||"");}
  const db=loadDB();
  const me=db.session?db.users.find(u=>u.id===db.session):null;
  const fail=m=>({ok:false,error:m});
  const needLogin=()=>me?null:fail("Please log in first.");
  const needRole=roles=>(me&&roles.indexOf(me.role)>=0)?null:fail("You are not authorised to do this.");
  const trim=v=>String(v==null?"":v).trim();

  switch(name){

    case "me": return {ok:true,user:pubUser(me)};

    case "register":{
      const f=["name","email","password","address","phone","card"];
      for(const k of f) if(!trim(data&&data[k])) return fail("Please complete all fields.");
      if(db.users.some(u=>u.email.toLowerCase()===trim(data.email).toLowerCase())) return fail("An account with this email already exists.");
      const id=++db.seq.users;
      const u={id,name:trim(data.name),email:trim(data.email),password:String(data.password),role:"user",address:trim(data.address),phone:trim(data.phone),card:trim(data.card),created_at:nowStr()};
      db.users.push(u); db.session=id; saveDB(db);
      return {ok:true,user:pubUser(u)};
    }

    case "login":{
      const u=db.users.find(x=>x.email.toLowerCase()===trim(data&&data.email).toLowerCase());
      if(!u||u.password!==String((data&&data.password)||"")) return fail("Wrong email or password.");
      db.session=u.id; saveDB(db);
      return {ok:true,user:pubUser(u)};
    }

    case "logout": db.session=null; saveDB(db); return {ok:true};

    case "updateProfile":{
      const e=needLogin(); if(e) return e;
      const u=db.users.find(x=>x.id===me.id); if(!u) return fail("User not found.");
      if(trim(data&&data.name)) u.name=trim(data.name);
      u.address=trim(data&&data.address); u.phone=trim(data&&data.phone); u.card=trim(data&&data.card);
      saveDB(db); return {ok:true,user:pubUser(u)};
    }

    case "packages":{
      const all=(q.all==="1")&&me&&["staff","admin"].indexOf(me.role)>=0;
      let rows=db.packages.filter(p=>all||p.active===1);
      rows=rows.slice().sort((a,b)=>a.category<b.category?-1:a.category>b.category?1:a.price-b.price);
      rows=rows.map(p=>({id:p.id,code:p.code,name:p.name,category:p.category,tier:p.tier,price:Number(p.price),features:Array.isArray(p.features)?p.features:[],active:p.active?1:0}));
      return {ok:true,packages:rows};
    }

    case "savePackage":{
      const e=needRole(["staff","admin"]); if(e) return e;
      const nm=trim(data.name),cat=trim(data.category),tier=trim(data.tier);
      const price=Number(data.price)||0;
      let features=Array.isArray(data.features)?data.features:String(data.features||"").split("\n").map(s=>s.trim()).filter(Boolean);
      const active=data.active?1:0;
      if(nm===""||cat===""||tier==="") return fail("Name, category and tier are required.");
      if(data.id){
        const p=db.packages.find(x=>String(x.id)===String(data.id));
        if(p){p.name=nm;p.category=cat;p.tier=tier;p.price=price;p.features=features;p.active=active;}
      } else {
        const id=++db.seq.packages;
        const code=trim(data.code)||("pkg-"+Math.random().toString(36).slice(2,8));
        db.packages.push({id,code,name:nm,category:cat,tier,price,features,active});
      }
      saveDB(db); return {ok:true};
    }

    case "deletePackage":{
      const e=needRole(["staff","admin"]); if(e) return e;
      db.packages=db.packages.filter(p=>String(p.id)!==String(data&&data.id));
      saveDB(db); return {ok:true};
    }

    case "placeOrder":{
      const e=needLogin(); if(e) return e;
      const id=++db.seq.orders;
      db.orders.push({id,user_id:me.id,package_name:trim(data&&data.package_name),total:Number(data&&data.total)||0,saved:Number(data&&data.saved)||0,status:"Paid",created_at:nowStr()});
      saveDB(db); return {ok:true};
    }

    case "orders":{
      const e=needLogin(); if(e) return e;
      let rows;
      if(["staff","admin"].indexOf(me.role)>=0){
        rows=db.orders.slice().sort((a,b)=>b.id-a.id).map(o=>{const u=db.users.find(x=>x.id===o.user_id)||{};return Object.assign({},o,{customer:u.name||"",email:u.email||""});});
      } else {
        rows=db.orders.filter(o=>o.user_id===me.id).slice().sort((a,b)=>b.id-a.id);
      }
      return {ok:true,orders:rows};
    }

    case "stats":{
      const e=needRole(["admin"]); if(e) return e;
      const byRole={}; db.users.forEach(u=>byRole[u.role]=(byRole[u.role]||0)+1);
      return {ok:true,stats:{
        users:db.users.length, customers:byRole.user||0, staff:byRole.staff||0, admins:byRole.admin||0,
        orders:db.orders.length, revenue:db.orders.reduce((s,o)=>s+(Number(o.total)||0),0),
        packages:db.packages.length, feedback:db.feedback.length
      }};
    }

    case "users":{
      const e=needRole(["admin"]); if(e) return e;
      const rows=db.users.slice().sort((a,b)=>a.id-b.id).map(u=>({id:u.id,name:u.name,email:u.email,role:u.role,phone:u.phone,created_at:u.created_at}));
      return {ok:true,users:rows};
    }

    case "setRole":{
      const e=needRole(["admin"]); if(e) return e;
      const role=data&&data.role;
      if(["admin","staff","user"].indexOf(role)<0) return fail("Invalid role.");
      const u=db.users.find(x=>String(x.id)===String(data.id)); if(u)u.role=role;
      saveDB(db); return {ok:true};
    }

    case "feedbackThreads":{
      const e=needRole(["staff","admin"]); if(e) return e;
      const map={};
      db.feedback.forEach(f=>{const u=db.users.find(x=>x.id===f.user_id);if(!u)return;
        if(!map[u.id])map[u.id]={id:u.id,name:u.name,email:u.email,messages:0,last_at:""};
        map[u.id].messages++; if(f.created_at>map[u.id].last_at)map[u.id].last_at=f.created_at;});
      const threads=Object.values(map).sort((a,b)=>a.last_at<b.last_at?1:-1);
      return {ok:true,threads};
    }

    case "feedback":{
      const e=needLogin(); if(e) return e;
      let uid;
      if(["staff","admin"].indexOf(me.role)>=0){ uid=parseInt(q.user_id||"0",10); if(!uid) return fail("Missing user_id."); }
      else uid=me.id;
      const msgs=db.feedback.filter(f=>f.user_id===uid).sort((a,b)=>a.id-b.id).map(f=>({sender:f.sender,message:f.message,created_at:f.created_at}));
      return {ok:true,messages:msgs};
    }

    case "sendFeedback":{
      const e=needLogin(); if(e) return e;
      const msg=trim(data&&data.message); if(msg==="") return fail("Message is empty.");
      let uid,sender;
      if(["staff","admin"].indexOf(me.role)>=0){ uid=parseInt((data&&data.user_id)||0,10); if(!uid) return fail("Missing user_id."); sender="staff"; }
      else { uid=me.id; sender="user"; }
      const id=++db.seq.feedback;
      db.feedback.push({id,user_id:uid,sender,message:msg,created_at:nowStr()});
      saveDB(db); return {ok:true};
    }

    default: return fail("Unknown action: "+name);
  }
}

const ROUTES={};
async function go(name,arg){
  window._active=name;
  const app=document.getElementById("app");
  app.innerHTML='<div class="wrap"><p class="lead">Loading…</p></div>';
  renderNav();
  try{ await (ROUTES[name]||ROUTES.home)(app,arg); }
  catch(e){ app.innerHTML='<div class="wrap"><div class="msg err">'+esc(e.message||"Error")+'</div></div>'; }
  app.classList.remove("fade"); void app.offsetWidth; app.classList.add("fade");
  window.scrollTo(0,0); renderNav();
}
/* nav items per role: [route, label, icon] */
function navItems(){
  if(!ME) return [["home","Packages","📦"],["custom","Build","🛠️"],["offers","Offers","🏷️"],["login","Login","🔑"],["register","Sign up","✍️"]];

  if(ME.role==="staff") return [["home","Packages","📦"],["staff","Staff","🧰"]];
  return [["home","Packages","📦"],["admin","Admin","🛡️"],["staff","Staff","🧰"]];
}
function renderNav(){
  const a=window._active, isDark=document.documentElement.getAttribute("data-theme")==="dark";
  const items=navItems();
  /* top text links (desktop) */
  document.getElementById("nav-links").innerHTML=items.map(it=>`<a class="${a===it[0]?'active':''}" onclick="go('${it[0]}')">${it[1]}</a>`).join("");
  /* top-right actions (always visible): theme + avatar/sign out */
  const theme=`<button class="theme-btn" onclick="toggleTheme()" title="Theme">${isDark?'☀️':'🌙'}</button>`;
  let right=theme;
  if(ME){
    const badge=ME.role!=="user"?`<span class="role-badge role-${ME.role}">${ME.role}</span>`:"";
    right+=`<span class="avatar">${esc(ME.name[0].toUpperCase())}</span>${badge}<button class="btn sec small" onclick="signout()">Sign out</button>`;
  }
  document.getElementById("top-actions").innerHTML=right;
  /* bottom app nav (mobile) */
  let bottom=items.map(it=>`<a class="${a===it[0]?'active':''}" onclick="go('${it[0]}')"><span class="ic">${it[2]}</span>${it[1]}</a>`).join("");
  if(ME) bottom+=`<a class="out" onclick="signout()"><span class="ic">⏻</span>Out</a>`;
  document.getElementById("bottom-nav").innerHTML=bottom;
}

      <div class="hint">Every order via the app saves you 15% automatically.</div>`;
  } else if(tab==="personal"){
    body=`<div class="acc-head">✏️ Personal Info</div><div id="p-msg"></div>
      <div class="fg"><label>Full name</label><input id="p-name" value="${esc(ME.name)}"></div>
      <div class="fg"><label>Email (cannot be changed)</label><input value="${esc(ME.email)}" disabled></div>
      <div class="fg"><label>Address</label><input id="p-addr" value="${esc(ME.address)}"></div>
      <div class="two-col"><div class="fg"><label>Telephone</label><input id="p-phone" value="${esc(ME.phone)}"></div><div class="fg"><label>Credit card number</label><input id="p-card" maxlength="19" value="${esc(ME.card)}"></div></div>
      <button class="btn" id="p-save">Save changes</button>
      <div class="hint">Your profile is saved on this device.</div>`;
  } else if(tab==="usage"){
    let h=0; for(const ch of ME.email) h=(h*31+ch.charCodeAt(0))%1000;
    const mins=320+h%180, sms=40+h%60, data=(4+(h%55)/10).toFixed(1);
    const bar=(l,u,t,unit,p)=>`<div class="usage-item"><div class="top"><span>${l}</span><span>${u} / ${t} ${unit}</span></div><div class="bar"><span style="--w:${p}%"></span></div></div>`;
    body=`<div class="acc-head">📈 Usage this month</div>${bar("Call minutes",mins,500,"min",Math.round(mins/5))}${bar("SMS",sms,100,"sms",sms)}${bar("Mobile data",data,10,"GB",Math.round(data*10))}<div class="hint">Usage is simulated for this prototype.</div>`;
  } else { // billing
    const hasDeal=orders.some(o=>/Bundle|Triple|Double/.test(o.package_name)), code=hasDeal?"SAVE10":"WELCOME5";
    body=`<div class="acc-head">💳 Billing &amp; orders</div><div class="offer-banner"><div>🎁 Your offer code: <code>${code}</code></div><button class="btn small" onclick="go('checkout')">Pay / order now</button></div>
      ${orders.length?`<div class="table-scroll"><table><thead><tr><th>Date</th><th>Package</th><th>Saved</th><th>Total paid</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc((o.created_at||"").slice(0,10))}</td><td>${esc(o.package_name)}</td><td class="discount">${gbp(o.saved)}</td><td>${gbp(o.total)}</td><td>${esc(o.status)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="lead">No orders yet. <a onclick="go('home')">Browse packages</a>.</p>`}`;
  }
  app.innerHTML=`<div class="wrap"><div class="acc-layout">${side}<section class="acc-main"><div class="panel">${body}</div></section></div></div>`;
  if(tab==="personal"){
    document.getElementById("p-save").addEventListener("click",async()=>{
      const r=await api("updateProfile",{name:document.getElementById("p-name").value.trim(),address:document.getElementById("p-addr").value.trim(),phone:document.getElementById("p-phone").value.trim(),card:document.getElementById("p-card").value.trim()});
      if(r.ok){ME=r.user;document.getElementById("p-msg").innerHTML=`<div class="msg ok">Profile saved.</div>`;toast("Profile updated.");renderNav();}
      else document.getElementById("p-msg").innerHTML=`<div class="msg err">${esc(r.error)}</div>`;
    });
  }
};

/* ===================== SUPPORT CHAT (user) ===================== */
ROUTES.support=async(app)=>{
  if(!ME){go("login");return;}
  app.innerHTML=`<div class="wrap"><h2 class="title">💬 Support</h2><p class="lead">Chat with our staff. Ask about packages, billing or anything else.</p>
    <div class="panel" style="max-width:640px"><div id="chat" class="chat"></div>
      <div class="chat-input"><input id="msg" placeholder="Type your message..."><button class="btn" id="send">Send</button></div></div></div>`;
  async function refresh(){
    const r=await api("feedback"); const box=document.getElementById("chat");
    box.innerHTML=(r.messages||[]).length?r.messages.map(m=>`<div class="bubble ${m.sender}"><div class="who">${m.sender==='user'?'You':'Staff'}</div>${esc(m.message)}</div>`).join(""):`<p class="lead" style="margin:10px">No messages yet. Say hello! 👋</p>`;
    box.scrollTop=box.scrollHeight;
  }
  async function send(){
    const i=document.getElementById("msg"); const t=i.value.trim(); if(!t) return;
    const r=await api("sendFeedback",{message:t}); if(r.ok){i.value="";refresh();} else toast(r.error);
  }
  document.getElementById("send").addEventListener("click",send);
  document.getElementById("msg").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
  refresh();
};

/* ===================== CHECKOUT + VISA card ===================== */
ROUTES.checkout=async(app,arg)=>{
  if(!ME){toast("Please log in to place an order.");go("login");return;}
  if(ME.role!=="user"){app.innerHTML=`<div class="wrap"><div class="msg err">Staff/Admin accounts cannot place customer orders. Log in as a customer.</div></div>`;return;}
  arg=arg||{};
  const r=await api("packages"); let opts=(r.packages||[]).map(p=>({code:p.code,name:p.name,price:p.price}));
  if(arg.custom) opts=[{code:"custom",name:arg.custom.name,price:arg.custom.price},...opts];
  app.innerHTML=`<div class="wrap"><h2 class="title">Checkout</h2>
    <div class="panel" style="max-width:600px"><div id="co-msg"></div>
      <div class="fg"><label>Choose a package / deal</label><select id="co-pkg">${opts.map(p=>`<option value="${esc(p.code)}" data-name="${esc(p.name)}" data-price="${p.price}">${esc(p.name)} - ${gbp(p.price)}/mo</option>`).join("")}</select></div>
      <div class="fg"><label>Special offer code (optional)</label><input id="co-offer" placeholder="e.g. SAVE10"></div>
      <div class="summary" id="co-sum"></div>
      <div class="acc-head" style="font-size:16px">💳 Pay by card <span class="badge">VISACheck secured</span></div>
      <div class="cc-wrap"><div class="cc-inner" id="cc-inner">
        <div class="cc front"><div class="cc-top"><span class="cc-chip"></span><span class="cc-brand">VISA</span></div>
          <div class="cc-num" id="cc-num">•••• •••• •••• ••••</div>
          <div class="cc-bot"><div><div class="cc-lab">Card holder</div><div class="val" id="cc-name">FULL NAME</div></div><div><div class="cc-lab">Expires</div><div class="val" id="cc-exp">MM/YY</div></div></div></div>
        <div class="cc back"><div class="cc-strip"></div><div class="cc-cvv-row"><span class="cc-lab">CVV</span><span class="cc-cvv" id="cc-cvv-disp">•••</span></div><div class="back-brand">VISA</div></div>
      </div></div>
      <div class="fg"><label>Name on card</label><input id="co-cn" value="${esc(ME.name)}"></div>
      <div class="fg"><label>Card number</label><input id="co-num" maxlength="19" inputmode="numeric" value="${esc(ME.card)}" placeholder="1234 5678 9012 3456"></div>
      <div class="two-col"><div class="fg"><label>Expiry (MM/YY)</label><input id="co-exp" maxlength="5" placeholder="08/27"></div><div class="fg"><label>CVV</label><input id="co-cvv" maxlength="3" inputmode="numeric" placeholder="123"></div></div>
      <button class="btn block" id="co-pay">Pay now</button>
      <div class="hint">Only credit card payment is accepted. The card is verified by "VISACheck".</div></div></div>`;
  const sel=document.getElementById("co-pkg"); if(arg.code&&opts.some(o=>o.code===arg.code)) sel.value=arg.code; if(arg.custom) sel.value="custom";
  const offer=document.getElementById("co-offer"), sum=document.getElementById("co-sum");
  const calc=()=>{const o=sel.options[sel.selectedIndex],name=o.dataset.name,base=+o.dataset.price,appD=base*APP_DISCOUNT,code=offer.value.trim().toUpperCase(),rate=OFFER_CODES[code]||0,offD=base*rate,total=base-appD-offD;
    let row=""; if(code) row=rate?`<div class="row"><span>Offer (${code})</span><span class="discount">- ${gbp(offD)}</span></div>`:`<div class="row"><span>Offer (${code})</span><span style="color:#dc2626">invalid code</span></div>`;
    sum.innerHTML=`<div class="row"><span>${esc(name)}</span><span>${gbp(base)}</span></div><div class="row"><span>App discount (15%)</span><span class="discount">- ${gbp(appD)}</span></div>${row}<div class="row total"><span>Total to pay</span><span>${gbp(total)}</span></div>`;
    sum.dataset.total=total.toFixed(2);sum.dataset.name=name;sum.dataset.saved=(appD+offD).toFixed(2);};
  sel.addEventListener("change",calc);offer.addEventListener("input",calc);calc();
  /* live card */
  const num=document.getElementById("co-num"),cn=document.getElementById("co-cn"),exp=document.getElementById("co-exp"),cvv=document.getElementById("co-cvv");
  const ccNum=document.getElementById("cc-num"),ccName=document.getElementById("cc-name"),ccExp=document.getElementById("cc-exp"),ccCvv=document.getElementById("cc-cvv-disp"),ccInner=document.getElementById("cc-inner");
  const fmt=v=>v.replace(/\D/g,"").slice(0,16).replace(/(.{4})/g,"$1 ").trim();
  const showNum=()=>{const d=num.value.replace(/\D/g,"");let out="";for(let i=0;i<16;i++)out+=(i<d.length?d[i]:"•")+((i+1)%4===0&&i<15?" ":"");ccNum.textContent=out;};
  num.addEventListener("input",()=>{num.value=fmt(num.value);showNum();});
  cn.addEventListener("input",()=>ccName.textContent=cn.value.trim()?cn.value.toUpperCase():"FULL NAME");
  exp.addEventListener("input",()=>{let v=exp.value.replace(/\D/g,"").slice(0,4);if(v.length>=3)v=v.slice(0,2)+"/"+v.slice(2);exp.value=v;ccExp.textContent=v||"MM/YY";});
  cvv.addEventListener("input",()=>ccCvv.textContent=cvv.value?cvv.value.replace(/./g,"•"):"•••");
  cvv.addEventListener("focus",()=>ccInner.classList.add("flip"));cvv.addEventListener("blur",()=>ccInner.classList.remove("flip"));
  num.value=fmt(num.value);showNum();ccName.textContent=cn.value?cn.value.toUpperCase():"FULL NAME";
  document.getElementById("co-pay").addEventListener("click",async()=>{
    const digits=num.value.replace(/\D/g,""),msg=document.getElementById("co-msg");
    if(digits.length<12||cvv.value.length!==3){msg.innerHTML=`<div class="msg err">VISACheck declined the card. Check the number and CVV.</div>`;window.scrollTo(0,0);return;}
    const res=await api("placeOrder",{package_name:sum.dataset.name,total:+sum.dataset.total,saved:+sum.dataset.saved});
    if(!res.ok){msg.innerHTML=`<div class="msg err">${esc(res.error)}</div>`;return;}
    toast("Payment successful — receipt emailed.");
    go("thanks",{name:ME.name,email:ME.email,packageName:sum.dataset.name,total:+sum.dataset.total,saved:+sum.dataset.saved});
  });
};

/* ===================== STAFF PANEL ===================== */
ROUTES.staff=async(app,arg)=>{
  if(!ME||(ME.role!=="staff"&&ME.role!=="admin")){go("login");return;}
  const tab=(arg&&arg.tab)||"packages";
  const tabBar=`<div class="tabs">
    <a class="${tab==='packages'?'active':''}" onclick="go('staff',{tab:'packages'})">📦 Manage packages</a>
    <a class="${tab==='feedback'?'active':''}" onclick="go('staff',{tab:'feedback'})">💬 Feedback</a>
    <a class="${tab==='orders'?'active':''}" onclick="go('staff',{tab:'orders'})">🧾 Orders</a></div>`;
  app.innerHTML=`<div class="wrap"><h2 class="title">Staff Panel</h2><p class="lead">Change prices, add options, and answer customer feedback.</p>${tabBar}<div id="staff-body"></div></div>`;
  const bodyEl=document.getElementById("staff-body");
  if(tab==="packages"){ await staffPackages(bodyEl); }
  else if(tab==="feedback"){ await staffFeedback(bodyEl); }
  else { await staffOrders(bodyEl); }
};
async function staffPackages(el){
  const r=await api("packages&all=1"); const pkgs=r.packages||[];
  el.innerHTML=`<button class="btn" id="add-pkg" style="margin-bottom:14px">+ Add new option</button>
    <div class="table-scroll"><table><thead><tr><th>Name</th><th>Category</th><th>Tier</th><th>Price (£)</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>${pkgs.map(p=>`<tr>
      <td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.tier)}</td>
      <td><input type="number" step="0.01" value="${p.price}" data-id="${p.id}" class="price-in" style="width:90px;padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)"></td>
      <td>${p.active?'Yes':'No'}</td>
      <td><button class="btn small save-price" data-id="${p.id}">Save price</button> <button class="btn small danger del-pkg" data-id="${p.id}">Delete</button></td>
    </tr>`).join("")}</tbody></table></div><div id="pkg-form"></div>`;
  el.querySelectorAll(".save-price").forEach(b=>b.addEventListener("click",async()=>{
    const id=b.dataset.id; const p=pkgs.find(x=>String(x.id)===String(id));
    const price=+el.querySelector(`.price-in[data-id="${id}"]`).value;
    const r=await api("savePackage",{id,name:p.name,category:p.category,tier:p.tier,price,features:p.features,active:p.active});
    toast(r.ok?"Price updated.":r.error);
  }));
  el.querySelectorAll(".del-pkg").forEach(b=>b.addEventListener("click",async()=>{
    if(!confirm("Delete this package?"))return; const r=await api("deletePackage",{id:b.dataset.id});
    if(r.ok){toast("Deleted.");go("staff",{tab:"packages"});} else toast(r.error);
  }));
  document.getElementById("add-pkg").addEventListener("click",()=>{
    document.getElementById("pkg-form").innerHTML=`<div class="panel" style="max-width:520px;margin-top:16px"><h3 class="sec-h" style="margin-top:0">New option</h3>
      <div class="fg"><label>Name</label><input id="np-name"></div>
      <div class="two-col"><div class="fg"><label>Category</label><select id="np-cat">${SEGMENTS.map(s=>`<option>${s}</option>`).join("")}</select></div>
        <div class="fg"><label>Tier</label><select id="np-tier"><option>Lite</option><option>Standard</option><option>Premium</option><option>Deal</option></select></div></div>
      <div class="fg"><label>Price (£/month)</label><input id="np-price" type="number" step="0.01" value="20"></div>
      <div class="fg"><label>Features (one per line)</label><textarea id="np-feat" rows="3" placeholder="1 mobile phone&#10;500 free minutes"></textarea></div>
      <button class="btn" id="np-save">Create option</button></div>`;
    document.getElementById("np-save").addEventListener("click",async()=>{
      const r=await api("savePackage",{name:document.getElementById("np-name").value.trim(),category:document.getElementById("np-cat").value,tier:document.getElementById("np-tier").value,price:+document.getElementById("np-price").value,features:document.getElementById("np-feat").value,active:1});
      if(r.ok){toast("Option created.");go("staff",{tab:"packages"});} else toast(r.error);
    });
  });
}
async function staffFeedback(el){
  const r=await api("feedbackThreads"); const threads=r.threads||[];
  el.innerHTML=`<div class="acc-layout"><aside><div class="panel" style="padding:14px"><h3 class="sec-h" style="margin:0 0 10px">Conversations</h3><div id="threads">${threads.length?threads.map(t=>`<div class="thread" data-id="${t.id}"><div><strong>${esc(t.name)}</strong><div style="font-size:12px;color:var(--muted)">${esc(t.email)}</div></div><span class="badge">${t.messages}</span></div>`).join(""):`<p class="lead">No conversations yet.</p>`}</div></div></aside>
    <section class="acc-main"><div class="panel"><div id="thread-chat"><p class="lead">Select a conversation to reply.</p></div></div></section></div>`;
  el.querySelectorAll(".thread").forEach(t=>t.addEventListener("click",()=>{el.querySelectorAll(".thread").forEach(x=>x.classList.toggle("active",x===t));openThread(t.dataset.id);}));
  async function openThread(uid){
    const box=document.getElementById("thread-chat");
    const r=await api("feedback&user_id="+uid);
    box.innerHTML=`<div class="chat" id="schat">${(r.messages||[]).map(m=>`<div class="bubble ${m.sender}"><div class="who">${m.sender==='user'?'Customer':'You (staff)'}</div>${esc(m.message)}</div>`).join("")||'<p class="lead" style="margin:10px">No messages.</p>'}</div>
      <div class="chat-input"><input id="sreply" placeholder="Type a reply..."><button class="btn" id="ssend">Reply</button></div>`;
    const c=document.getElementById("schat"); c.scrollTop=c.scrollHeight;
    async function send(){const i=document.getElementById("sreply");const t=i.value.trim();if(!t)return;const rr=await api("sendFeedback",{user_id:uid,message:t});if(rr.ok){i.value="";openThread(uid);}else toast(rr.error);}
    document.getElementById("ssend").addEventListener("click",send);
    document.getElementById("sreply").addEventListener("keydown",e=>{if(e.key==="Enter")send();});
  }
}
async function staffOrders(el){
  const r=await api("orders"); const orders=r.orders||[];
  el.innerHTML=orders.length?`<div class="table-scroll"><table><thead><tr><th>Date</th><th>Customer</th><th>Email</th><th>Package</th><th>Total</th><th>Status</th></tr></thead><tbody>${orders.map(o=>`<tr><td>${esc((o.created_at||"").slice(0,10))}</td><td>${esc(o.customer||"")}</td><td>${esc(o.email||"")}</td><td>${esc(o.package_name)}</td><td>${gbp(o.total)}</td><td>${esc(o.status)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="lead">No orders yet.</p>`;
}

/* ===================== ADMIN PANEL ===================== */
ROUTES.admin=async(app,arg)=>{

  const tabBar=`<div class="tabs">
    <a class="${tab==='overview'?'active':''}" onclick="go('admin',{tab:'overview'})">📊 Overview</a>
    <a class="${tab==='users'?'active':''}" onclick="go('admin',{tab:'users'})">👥 Users &amp; roles</a></div>`;

      <div class="stat"><div class="num">${s.users||0}</div><div class="lab">Total accounts</div></div>
      <div class="stat"><div class="num">${s.customers||0}</div><div class="lab">Customers (users)</div></div>
      <div class="stat"><div class="num">${s.orders||0}</div><div class="lab">Total orders</div></div></div>
      <div class="stats">
      <div class="stat"><div class="num green">${gbp(s.revenue||0)}</div><div class="lab">Total revenue</div></div>
      <div class="stat"><div class="num">${s.staff||0}</div><div class="lab">Staff members</div></div>
      <div class="stat"><div class="num">${s.feedback||0}</div><div class="lab">Feedback messages</div></div></div>
      <div class="hint">There are ${s.packages||0} packages on sale. Go to the Staff Panel to manage prices, options and feedback.</div>`;
  } else {
    const r=await api("users"); const users=r.users||[];
    el.innerHTML=`<div class="table-scroll"><table><thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Change role</th></tr></thead>
      <tbody>${users.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${esc(u.phone)}</td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td><select class="role-sel" data-id="${u.id}" style="padding:6px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)">
          ${["user","staff","admin"].map(rl=>`<option value="${rl}" ${rl===u.role?'selected':''}>${rl}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div>
      <div class="hint">Changing a role takes effect next time that person loads a page.</div>`;
    el.querySelectorAll(".role-sel").forEach(s=>s.addEventListener("change",async()=>{
      const r=await api("setRole",{id:s.dataset.id,role:s.value}); toast(r.ok?"Role updated.":r.error); if(r.ok) go("admin",{tab:"users"});
    }));
  }
};
